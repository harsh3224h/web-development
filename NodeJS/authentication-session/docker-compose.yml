services:
  db:
    image: postgres:17.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432" # Added missing space and quotes for standard format
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: